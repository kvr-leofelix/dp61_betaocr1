version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: lumeneios-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://lumeneios_user:lumeneios_secret_pass@postgres:5432/lumeneios_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=lumeneios-documents
      - SECRET_KEY=lumeneios-super-secure-production-ready-secret-key-32charsmin!
      - DEMO_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - backend_uploads:/app/storage_uploads
    networks:
      - lumeneios-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumeneios-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lumeneios_user
      - POSTGRES_PASSWORD=lumeneios_secret_pass
      - POSTGRES_DB=lumeneios_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumeneios_user -d lumeneios_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lumeneios-network

  redis:
    image: redis:7-alpine
    container_name: lumeneios-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lumeneios-network

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: lumeneios-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lumeneios-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:

networks:
  lumeneios-network:
    driver: bridge

